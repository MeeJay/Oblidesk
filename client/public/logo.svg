<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" width="200" height="44" role="img" aria-label="Oblidesk">
  <!-- Oblidesk lockup: the speech-bubble-with-check mark + wordmark.
       Used for the favicon fallback, the manifest and any og:image. The topbar
       renders components/common/Logo.tsx instead, which draws the same mark
       inline so it can pick up the live theme accent. -->
  <defs>
    <linearGradient id="od-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fd0ff"/>
      <stop offset="100%" stop-color="#1789bb"/>
    </linearGradient>
  </defs>

  <!-- Mark, 32x32 on a 6px top margin -->
  <g transform="translate(4 6)">
    <path d="M9 6.5h14a3.5 3.5 0 0 1 3.5 3.5v8a3.5 3.5 0 0 1-3.5 3.5h-6.9l-4.6 4.1A1 1 0 0 1 9.8 25v-3.5H9A3.5 3.5 0 0 1 5.5 18v-8A3.5 3.5 0 0 1 9 6.5Z" fill="url(#od-mark)"/>
    <path d="m11.6 14.2 3.1 3.1 6.1-6.4" fill="none" stroke="#0b0d1a" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark. Rajdhani when the suite font is loaded, condensed sans otherwise. -->
  <text x="42" y="30"
        font-family="Rajdhani, 'Segoe UI Semibold', 'Helvetica Neue', Arial, sans-serif"
        font-size="25" font-weight="600" letter-spacing="0.5"
        fill="#e8ecf5">Obli<tspan fill="#22b8f5">desk</tspan></text>
</svg>
