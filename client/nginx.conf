server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ticket attachments and inline images can be large; inbound mail with
    # attachments arrives through /api/tickets/:id/attachments.
    client_max_body_size 64m;

    # API proxy
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        # Attachment downloads stream straight from disk - don't buffer them.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Socket.io proxy (live ticket / SLA / alert updates)
    location /socket.io/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
    }

    # Health check endpoint proxy (also used by the Docker HEALTHCHECK chain)
    location /health {
        proxy_pass http://server:3001;
    }

    # Obligate SSO callback (server-side redirect + code exchange).
    # Must be listed before the SPA fallback or Nginx would serve index.html.
    location /auth/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The attachment blob store is a server-side bind mount (/custom). It must
    # never be reachable over HTTP - every download goes through /api, which
    # checks the tenant scope and the attachment_links refcount first.
    location /custom/ {
        deny all;
        return 404;
    }

    # Hashed build assets are content-addressed by Vite - cache them forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets outside /assets (favicon, fonts, logos)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
