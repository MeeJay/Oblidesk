# Builds both images from this working tree instead of pulling them from Docker Hub.
# Usage: docker compose -f docker-compose.build.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oblidesk
      POSTGRES_USER: oblidesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oblidesk"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://oblidesk:${DB_PASSWORD:-changeme}@postgres:5432/oblidesk
      SESSION_SECRET: ${SESSION_SECRET:-change-this-in-production}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      APP_NAME: ${APP_NAME:-Oblidesk}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    volumes:
      # Attachment blob store - survives image updates.
      - ${CUSTOM_DIR:-./custom}:/custom

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${LISTEN_PORT:-3004}:80"

volumes:
  postgres_data:
